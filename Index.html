<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BBiG — Klausurvorbereitung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E9E8E2;
  --sheet:#FBFAF6;
  --sheet-2:#F2F1EB;
  --ink:#1F2328;
  --ink-2:#5C6168;
  --rule:#C7C5BB;
  --rule-soft:#DEDCD3;
  --blue:#2B4EA2;
  --blue-soft:#E3E9F7;
  --green:#2C6A4D;
  --green-soft:#E0EDE5;
  --red:#BC2F23;
  --red-soft:#F7E4E1;
  --amber:#8A6512;
  --shadow:0 1px 0 rgba(31,35,40,.06);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#15171B;
    --sheet:#1D2025;
    --sheet-2:#23272D;
    --ink:#E9E8E2;
    --ink-2:#9BA1A9;
    --rule:#353A42;
    --rule-soft:#2A2E35;
    --blue:#90AAEE;
    --blue-soft:#1D2540;
    --green:#7BC49E;
    --green-soft:#16271E;
    --red:#E8877C;
    --red-soft:#2D1816;
    --amber:#D6AC54;
    --shadow:0 1px 0 rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --paper:#15171B; --sheet:#1D2025; --sheet-2:#23272D;
  --ink:#E9E8E2; --ink-2:#9BA1A9; --rule:#353A42; --rule-soft:#2A2E35;
  --blue:#90AAEE; --blue-soft:#1D2540;
  --green:#7BC49E; --green-soft:#16271E;
  --red:#E8877C; --red-soft:#2D1816; --amber:#D6AC54;
  --shadow:0 1px 0 rgba(0,0,0,.35);
}
*,*::before,*::after{box-sizing:inherit}
html{ -webkit-text-size-adjust:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:"Archivo","Helvetica Neue",Arial,sans-serif;
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
button{font:inherit;color:inherit;margin:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.wrap{max-width:560px;margin:0 auto;padding:0 14px 120px}

/* ---------- Formularkopf ---------- */
.masthead{
  border:1px solid var(--ink);
  background:var(--sheet);
  margin:14px 0 18px;
}
.masthead-top{
  display:flex;align-items:stretch;
  border-bottom:1px solid var(--ink);
}
.mark{
  padding:12px 12px 10px;
  border-right:1px solid var(--ink);
  font-weight:700;
  font-size:26px;
  line-height:1;
  letter-spacing:-.02em;
  display:flex;align-items:center;
  font-family:"Source Serif 4",Georgia,serif;
}
.masthead-title{padding:10px 12px;flex:1}
.masthead-title h1{
  margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em;line-height:1.2;
}
.masthead-title p{margin:2px 0 0;font-size:12.5px;color:var(--ink-2)}
.masthead-meta{
  display:grid;grid-template-columns:1fr 1fr 1fr;
}
.meta-cell{padding:8px 12px 9px;border-right:1px solid var(--rule)}
.meta-cell:last-child{border-right:0}
.meta-cell .k{font-size:10.5px;color:var(--ink-2);display:block;line-height:1.3}
.meta-cell .v{font-size:19px;font-weight:600;letter-spacing:-.01em}

/* ---------- Abschnitts-Karten ---------- */
.sectionlist{display:flex;flex-direction:column;gap:9px}
.sec{
  display:flex;width:100%;text-align:left;
  background:var(--sheet);
  border:1px solid var(--rule);
  border-radius:2px;
  padding:0;cursor:pointer;
  box-shadow:var(--shadow);
  transition:border-color .12s ease, background .12s ease;
}
.sec:active{background:var(--sheet-2)}
.sec:hover{border-color:var(--ink-2)}
.sec-letter{
  width:44px;flex:none;
  border-right:1px solid var(--rule);
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:16px;
  color:var(--blue);
  background:var(--sheet-2);
}
.sec-body{padding:11px 12px 12px;flex:1;min-width:0}
.sec-body h2{margin:0;font-size:15.5px;font-weight:600;letter-spacing:-.005em}
.sec-body p{margin:2px 0 0;font-size:13px;color:var(--ink-2);line-height:1.35}
.sec-state{
  flex:none;display:flex;align-items:center;padding-right:12px;
  font-size:12px;color:var(--ink-2);
}
.tick{
  width:17px;height:17px;border:1px solid var(--rule);
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--paper);
}
.tick.on{border-color:var(--green);background:var(--green-soft);color:var(--green);font-weight:700;font-size:12px}
.sec.weak .sec-letter{color:var(--red)}
.sec.weak{border-color:var(--red)}

.note{
  margin:16px 0 0;font-size:12.5px;color:var(--ink-2);
  border-top:1px solid var(--rule-soft);padding-top:10px;line-height:1.5;
}
.linkbtn{
  background:none;border:0;padding:0;color:var(--blue);
  text-decoration:underline;text-underline-offset:2px;cursor:pointer;font-size:12.5px;
}

/* ---------- Session ---------- */
.bar{
  position:sticky;top:0;z-index:20;
  background:var(--paper);
  padding-top:env(safe-area-inset-top,0px);
  border-bottom:1px solid var(--rule);
}
.bar-in{
  max-width:560px;margin:0 auto;padding:9px 14px 8px;
  display:flex;align-items:center;gap:12px;
}
.back{
  background:none;border:1px solid var(--rule);border-radius:2px;
  padding:5px 9px;font-size:13px;cursor:pointer;line-height:1;
}
.bar-title{font-size:13.5px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-count{font-size:13px;color:var(--ink-2);flex:none}
.pbar{height:2px;background:var(--rule-soft)}
.pbar i{display:block;height:100%;background:var(--blue);width:0;transition:width .25s ease}

.card{
  background:var(--sheet);border:1px solid var(--rule);border-radius:2px;
  padding:16px 14px;margin-top:14px;box-shadow:var(--shadow);
}
.eyebrow{font-size:11.5px;color:var(--ink-2);margin:0 0 8px}
.q{margin:0;font-size:20px;line-height:1.3;font-weight:600;letter-spacing:-.015em}
.q.small{font-size:17px;font-weight:500;line-height:1.4}
.fall{
  font-family:"Source Serif 4",Georgia,serif;
  font-size:17px;line-height:1.5;margin:0;
}
.fall b{font-weight:600}

.opts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.opt{
  display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;
  background:var(--sheet);border:1px solid var(--rule);border-radius:2px;
  padding:11px 12px;cursor:pointer;font-size:15.5px;line-height:1.35;
  transition:background .1s ease,border-color .1s ease;
}
.opt:active{background:var(--sheet-2)}
.opt .let{
  flex:none;width:20px;height:20px;border:1px solid var(--rule);
  display:flex;align-items:center;justify-content:center;
  font-size:11.5px;font-weight:600;color:var(--ink-2);margin-top:1px;
}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.right .let{border-color:var(--green);color:var(--green)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .let{border-color:var(--red);color:var(--red)}
.opt.dim{opacity:.5}
.opt[disabled]{cursor:default}

.verdict{
  margin-top:14px;border:1px solid var(--rule);border-radius:2px;
  padding:12px;background:var(--sheet-2);
}
.verdict .vh{
  font-size:13px;font-weight:700;letter-spacing:.01em;margin:0 0 5px;
  display:flex;align-items:center;gap:7px;
}
.verdict.ok .vh{color:var(--green)}
.verdict.no .vh{color:var(--red)}
.verdict.ok{border-color:var(--green)}
.verdict.no{border-color:var(--red)}
.stamp{
  border:1.5px solid currentColor;border-radius:2px;
  padding:1px 5px;font-size:10.5px;letter-spacing:.04em;
  transform:rotate(-2.5deg);
}
.verdict p{margin:0;font-size:14.5px;line-height:1.5;color:var(--ink)}
.verdict p + p{margin-top:7px}
.law{
  font-family:"Source Serif 4",Georgia,serif;font-style:italic;
  color:var(--ink-2);font-size:13.5px;display:block;margin-top:7px;
}
@media (prefers-reduced-motion: no-preference){
  .verdict{animation:pop .18s ease-out}
}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* Flip */
.flipface{
  min-height:150px;display:flex;align-items:center;
  font-size:19px;line-height:1.35;font-weight:600;letter-spacing:-.01em;
}
.flipback{border-top:1px dashed var(--rule);margin-top:14px;padding-top:13px}
.flipback ul{margin:8px 0 0;padding-left:18px}
.flipback li{margin:0 0 5px;font-size:15px;line-height:1.4}
.flipback p{margin:0;font-size:15.5px;line-height:1.5}

/* Recall */
.slots{list-style:none;margin:14px 0 0;padding:0;counter-reset:s}
.slots li{
  border:1px solid var(--rule-soft);border-radius:2px;
  padding:9px 11px;margin-bottom:7px;font-size:15px;line-height:1.35;
  display:flex;gap:10px;align-items:flex-start;background:var(--sheet-2);
  color:var(--ink-2);
}
.slots li .n{flex:none;width:18px;font-weight:600;color:var(--ink-2);font-size:13px;margin-top:1px}
.slots li.shown{background:var(--sheet);color:var(--ink);border-color:var(--rule)}
.slots li.hit{border-color:var(--green);background:var(--green-soft)}
.slots li.miss{border-color:var(--red);background:var(--red-soft)}
.selfcheck{display:flex;gap:7px;margin-top:9px}
.selfcheck button{
  flex:1;border:1px solid var(--rule);background:var(--sheet);border-radius:2px;
  padding:9px;font-size:13.5px;cursor:pointer;
}
.selfcheck .yes{border-color:var(--green);color:var(--green)}
.selfcheck .no{border-color:var(--red);color:var(--red)}

/* Matrix */
.matrix{margin-top:14px;border:1px solid var(--ink);background:var(--sheet)}
.mrow{display:grid;grid-template-columns:78px 1fr 1fr;border-bottom:1px solid var(--rule)}
.mrow:last-child{border-bottom:0}
.mrow.head{background:var(--sheet-2);border-bottom:1px solid var(--ink)}
.mcell{padding:9px 8px;border-right:1px solid var(--rule);font-size:12.5px;line-height:1.3}
.mcell:last-child{border-right:0}
.mrow.head .mcell{font-weight:600;font-size:12px}
.mrow .rowlab{font-weight:600;font-size:12px;display:flex;align-items:center}
button.mcell{
  background:var(--sheet);text-align:left;cursor:pointer;min-height:62px;
  display:flex;align-items:center;
}
button.mcell.empty{color:var(--ink-2)}
button.mcell.right{background:var(--green-soft);border-color:var(--green)}
button.mcell.wrong{background:var(--red-soft);border-color:var(--red)}
.picker{margin-top:12px;border:1px solid var(--blue);border-radius:2px;padding:11px;background:var(--blue-soft)}
.picker h3{margin:0 0 9px;font-size:13px;font-weight:600}

/* Spickzettel */
.cheat h2{
  font-size:13px;font-weight:700;margin:20px 0 7px;
  padding-bottom:4px;border-bottom:1px solid var(--rule);
}
.cheat h2:first-child{margin-top:0}
.cheat dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:14.5px}
.cheat dt{font-weight:600;white-space:nowrap}
.cheat dd{margin:0;color:var(--ink)}
.cheat ul{margin:0;padding-left:18px;font-size:14.5px}
.cheat li{margin-bottom:4px;line-height:1.4}
.cheat table{width:100%;border-collapse:collapse;font-size:13.5px}
.cheat th,.cheat td{border:1px solid var(--rule);padding:7px 8px;text-align:left;vertical-align:top}
.cheat th{background:var(--sheet-2);font-weight:600;font-size:12.5px}

/* Ergebnis */
.score{font-size:52px;font-weight:700;letter-spacing:-.04em;line-height:1;margin:0}
.score small{font-size:20px;font-weight:500;color:var(--ink-2);letter-spacing:-.01em}
.reviewlist{margin-top:16px;display:flex;flex-direction:column;gap:9px}
.rev{border:1px solid var(--rule);border-left:3px solid var(--red);border-radius:2px;padding:10px 11px;background:var(--sheet)}
.rev p{margin:0;font-size:14px;line-height:1.4}
.rev .rq{font-weight:600;margin-bottom:4px}
.rev .ra{color:var(--ink-2);font-size:13.5px}

/* Aktionsleiste */
.actions{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:var(--paper);
  border-top:1px solid var(--rule);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));
}
.actions-in{max-width:560px;margin:0 auto;display:flex;gap:8px}
.btn{
  flex:1;border:1px solid var(--ink);border-radius:2px;
  background:var(--ink);color:var(--paper);
  padding:13px;font-size:15.5px;font-weight:600;cursor:pointer;
}
.btn:active{opacity:.85}
.btn.ghost{background:var(--sheet);color:var(--ink);border-color:var(--rule)}
.btn[disabled]{opacity:.4;cursor:default}
.hidden{display:none !important}
</style>
</head>
<body>

<div id="app"></div>
<div class="actions hidden" id="actions"><div class="actions-in" id="actionsIn"></div></div>

/* ============================================================
   STATE
   ============================================================ */
const KEY="bbig.lern.v1";
let store={stats:{},done:{}};
try{ const raw=localStorage.getItem(KEY); if(raw) store=Object.assign(store,JSON.parse(raw)); }catch(e){}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(store)); }catch(e){} }
function mark(id,ok){
  const s=store.stats[id]||{seen:0,wrong:0,ok:0};
  s.seen++; if(ok) s.ok++; else s.wrong++;
  store.stats[id]=s; save();
}
function weakIds(){
  return Object.keys(store.stats).filter(k=>{
    const s=store.stats[k]; return s.wrong>0 && s.wrong>=s.ok;
  });
}
const app=document.getElementById("app");
const actions=document.getElementById("actions");
const actionsIn=document.getElementById("actionsIn");
function setActions(html){ if(!html){actions.classList.add("hidden");actionsIn.innerHTML="";return;} actions.classList.remove("hidden"); actionsIn.innerHTML=html; }
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

const MODES=[

  {k:"B", id:"cards", t:"Karteikarten", d:"Kernaussagen aufdecken und selbst bewerten"},

  {k:"D", id:"nums",  t:"Zahlen und Fristen", d:"Schnellfeuer auf Probezeit, Fristen, Urlaub"},

function home(){
  setActions("");
  const total=Object.keys(store.stats).length;

  const okAns=Object.values(store.stats).reduce((a,s)=>a+s.ok,0);
  const quote=allAns?Math.round(okAns/allAns*100):0;
  const weak=weakIds().length;

  let secs=MODES.map(m=>`

    secs+=`

  }

  app.innerHTML=`<div class="wrap">

        <div class="masthead-title">
          <h1>Berufsbildungsgesetz</h1>

        </div>

        <div class="meta-cell"><span class="k">Beantwortet</span><span class="v">${allAns}</span></div>
        <div class="meta-cell"><span class="k">Trefferquote</span><span class="v">${allAns?quote+"%":"—"}</span></div>
        <div class="meta-cell"><span class="k">Offen</span><span class="v">${weak}</span></div>
      </div>
    </div>
    <div class="sectionlist">${secs}</div>
    <p class="note">Dein Fortschritt bleibt auf diesem Gerät gespeichert. Wer den Link teilt, lernt auf seinem eigenen Handy mit eigenem Stand.
    <br><button class="linkbtn" id="reset">Fortschritt zurücksetzen</button></p>
  </div>`;

  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>route(b.dataset.go));
  document.getElementById("reset").onclick=()=>{
    if(confirm("Fortschritt auf diesem Gerät löschen?")){ store={stats:{},done:{}}; save(); home(); }
  };
  window.scrollTo(0,0);
}

function route(id){
  if(id==="cheat") return cheat();
  if(id==="matrix") return matrixMode();
  if(id==="lists") return session(shuffle(RECALLS).map(r=>({...r,type:"recall"})),"Listen aufsagen","lists");
  if(id==="cards") return session(shuffle(FLIPS).map(f=>({...f,type:"flip"})),"Karteikarten","cards");
  if(id==="cases") return session(shuffle(CASES).map(c=>({...c,type:"case"})),"Fälle entscheiden","cases");
  if(id==="nums")  return session(shuffle(NUMBERS).map(n=>({...n,type:"mc"})),"Zahlen und Fristen","nums");
  if(id==="quick"){
    const pool=[...MC.map(x=>({...x,type:"mc"})),...NUMBERS.map(x=>({...x,type:"mc"})),...CASES.map(x=>({...x,type:"case"}))];
    const w=weakIds();
    const weakFirst=pool.filter(x=>w.includes(x.id));
    const rest=shuffle(pool.filter(x=>!w.includes(x.id)));
    return session([...shuffle(weakFirst).slice(0,5),...rest].slice(0,12),"Schnellcheck","quick");
  }
  if(id==="weak"){
    const w=weakIds();
    const pool=[...MC.map(x=>({...x,type:"mc"})),...NUMBERS.map(x=>({...x,type:"mc"})),
                ...CASES.map(x=>({...x,type:"case"})),...MATRIX.cells.map(x=>({...x,type:"mxq"}))];
    const items=pool.filter(x=>w.includes(x.id));
    if(!items.length) return home();
    return session(shuffle(items),"Schwachstellen","weak");
  }
}

   ============================================================ */
let S=null;

function session(items,title,modeId){
  S={items,i:0,title,modeId,right:0,wrong:[],answered:false};
  renderItem();
}

function header(){
  const pct=Math.round(S.i/S.items.length*100);
  return `<div class="bar"><div class="bar-in">
      <button class="back" id="back">Zurück</button>
      <span class="bar-title">${esc(S.title)}</span>
      <span class="bar-count">${S.i+1} / ${S.items.length}</span>
    </div><div class="pbar"><i style="width:${pct}%"></i></div></div>`;
}

function renderItem(){
  const it=S.items[S.i];
  S.answered=false;
  if(it.type==="mc") return renderMC(it);
  if(it.type==="case") return renderCase(it);
  if(it.type==="flip") return renderFlip(it);
  if(it.type==="recall") return renderRecall(it);
  if(it.type==="mxq") return renderMxq(it);
}

function bindBack(){ const b=document.getElementById("back"); if(b) b.onclick=home; window.scrollTo(0,0); }

function nextBtn(label){
  setActions(`<button class="btn" id="next">${label||"Weiter"}</button>`);
  document.getElementById("next").onclick=advance;
}
function advance(){
  S.i++;
  if(S.i>=S.items.length) return finish();
  renderItem();
}

/* --- Multiple Choice --- */
function renderMC(it){
  const order=shuffle(it.o.map((t,idx)=>({t,idx})));
  app.innerHTML=header()+`<div class="wrap">
    <div class="card">
      <p class="q">${esc(it.q)}</p>
      <div class="opts" id="opts">${order.map((o,i)=>
        `<button class="opt" data-idx="${o.idx}"><span class="let">${"ABCD"[i]}</span><span>${esc(o.t)}</span></button>`).join("")}</div>
      <div id="fb"></div>
    </div>
  </div>`;
  bindBack(); setActions("");
  app.querySelectorAll(".opt").forEach(b=>{
    b.onclick=()=>{
      if(S.answered) return; S.answered=true;
      const chosen=+b.dataset.idx, ok=chosen===it.c;
      app.querySelectorAll(".opt").forEach(x=>{
        x.disabled=true;
        const xi=+x.dataset.idx;
        if(xi===it.c) x.classList.add("right");
        else if(xi===chosen) x.classList.add("wrong");
        else x.classList.add("dim");
      });
      mark(it.id,ok);
      if(ok) S.right++; else S.wrong.push({q:it.q,a:it.o[it.c],e:it.e});
      document.getElementById("fb").innerHTML=verdictBox(ok, ok?"Richtig":"Falsch", it.e, ok?null:("Richtig wäre: "+esc(it.o[it.c])));
      nextBtn();
      document.getElementById("fb").scrollIntoView({behavior:"smooth",block:"nearest"});
    };
  });
}

function verdictBox(ok,stamp,text,extra){
  return `<div class="verdict ${ok?"ok":"no"}">
    <p class="vh"><span class="stamp">${esc(stamp)}</span></p>
    ${extra?`<p><b>${extra}</b></p>`:""}
    <p>${esc(text)}</p>
  </div>`;
}

/* --- Recall --- */
function renderRecall(it){
  let shown=0, hits=0;
  app.innerHTML=header()+`<div class="wrap">
    <div class="card">
      <p class="eyebrow">Sag alle Punkte laut auf, dann deck sie einzeln auf</p>
      <p class="q small">${esc(it.q)}</p>
      <p class="eyebrow" style="margin-top:8px">${esc(it.hint)}</p>
      <ul class="slots" id="slots">${it.items.map((x,i)=>
        `<li data-i="${i}"><span class="n">${i+1}</span><span class="txt">—</span></li>`).join("")}</ul>
      <div id="sc"></div>
    </div>
  </div>`;
  bindBack();
  const slots=document.getElementById("slots");
  const sc=document.getElementById("sc");

  function step(){
    if(shown>=it.items.length){
      const ok = hits >= Math.ceil(it.items.length*0.7);
      mark(it.id,ok);
      if(ok) S.right++; else S.wrong.push({q:it.q,a:hits+" von "+it.items.length+" gewusst",e:it.items.join(" · ")});
      sc.innerHTML=`<div class="verdict ${ok?"ok":"no"}">
        <p class="vh"><span class="stamp">${hits} von ${it.items.length}</span></p>
        <p>${ok?"Sitzt gut. Die fehlenden Punkte kommen im Schwachstellen-Modus wieder.":"Noch nicht sicher. Lies die Liste einmal von oben nach unten durch und wiederhole sie später."}</p>
      </div>`;
      nextBtn();
      return;
    }
    const li=slots.querySelector(`[data-i="${shown}"]`);
    li.classList.add("shown");
    li.querySelector(".txt").textContent=it.items[shown];
    sc.innerHTML=`<div class="selfcheck">
      <button class="no" id="miss">Hatte ich nicht</button>
      <button class="yes" id="hit">Hatte ich</button></div>`;
    document.getElementById("hit").onclick=()=>{li.classList.add("hit");hits++;shown++;step();};
    document.getElementById("miss").onclick=()=>{li.classList.add("miss");shown++;step();};
    li.scrollIntoView({behavior:"smooth",block:"center"});
  }
  setActions(`<button class="btn" id="go">Ersten Punkt aufdecken</button>`);
  document.getElementById("go").onclick=()=>{setActions("");step();};
}

function matrixMode(){
  const picked={};
  S={items:[],i:0,title:"Kündigungs-Matrix",modeId:"matrix",right:0,wrong:[]};
  function draw(active){
    const cell=(k)=>{
      const c=MATRIX.cells.find(x=>x.id===k);
      const p=picked[k];
      const cls=p==null?"empty":(p===c.c?"right":"wrong");
      const txt=p==null?"Antippen":MATRIX.opts[p];
      return `<button class="mcell ${cls}" data-cell="${k}">${esc(txt)}</button>`;
    };
    app.innerHTML=`<div class="bar"><div class="bar-in">
        <button class="back" id="back">Zurück</button>
        <span class="bar-title">Kündigungs-Matrix</span>
        <span class="bar-count">${Object.keys(picked).length} / 4</span>
      </div><div class="pbar"><i style="width:${Object.keys(picked).length/4*100}%"></i></div></div>
    <div class="wrap">
      <div class="card">
        <p class="eyebrow">Tipp jedes Feld an und wähle, was dort gilt</p>
        <div class="matrix">
          <div class="mrow head"><div class="mcell"></div><div class="mcell">Ausbildender</div><div class="mcell">Auszubildender</div></div>
          <div class="mrow"><div class="mcell rowlab">In der Probezeit</div>${cell("mx1")}${cell("mx2")}</div>
          <div class="mrow"><div class="mcell rowlab">Nach der Probezeit</div>${cell("mx3")}${cell("mx4")}</div>
        </div>
        <div id="pick"></div>
      </div>
    </div>`;
    document.getElementById("back").onclick=home;
    app.querySelectorAll("[data-cell]").forEach(b=>b.onclick=()=>openPicker(b.dataset.cell));
    if(Object.keys(picked).length===4){
      const allOk=MATRIX.cells.every(c=>picked[c.id]===c.c);
      document.getElementById("pick").innerHTML=
        `<div class="verdict ${allOk?"ok":"no"}">
          <p class="vh"><span class="stamp">${MATRIX.cells.filter(c=>picked[c.id]===c.c).length} von 4</span></p>
          <p>Merksatz: In der Probezeit sind beide gleichgestellt und keiner braucht einen Grund. Nach der Probezeit hat der Azubi mehr Rechte als der Chef — der kommt nur noch mit einem wichtigen Grund raus.</p>
          <p>Form: immer schriftlich. Begründung: erst nach der Probezeit.</p>
        </div>`;
      store.done.matrix=true; save();
      setActions(`<button class="btn ghost" id="again">Nochmal</button><button class="btn" id="hm">Fertig</button>`);
      document.getElementById("again").onclick=()=>{for(const k in picked) delete picked[k]; draw();};
      document.getElementById("hm").onclick=home;
    } else setActions("");
    window.scrollTo(0,0);
  }
  function openPicker(k){
    const c=MATRIX.cells.find(x=>x.id===k);
    const box=document.getElementById("pick");
    box.innerHTML=`<div class="picker">
      <h3>${esc(c.row)} — ${esc(c.col)}</h3>
      <div class="opts">${MATRIX.opts.map((t,i)=>
        `<button class="opt" data-o="${i}"><span class="let">${"ABCD"[i]}</span><span>${esc(t)}</span></button>`).join("")}</div>
    </div>`;
    box.scrollIntoView({behavior:"smooth",block:"nearest"});
    box.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{
      const v=+b.dataset.o;
      picked[k]=v;
      mark(c.id, v===c.c);
      draw();
      if(v!==c.c){
        const p=document.getElementById("pick");
        if(Object.keys(picked).length<4) p.innerHTML=`<div class="verdict no"><p class="vh"><span class="stamp">Falsch</span></p><p>${esc(c.e)}</p></div>`;
      }
    });
  }
  draw();
}

  else if(pct>=70) urteil="Solide Basis. Geh die falschen Punkte unten durch, die kommen im Schwachstellen-Modus wieder.";
  else urteil="Noch wackelig. Lies den Spickzettel einmal komplett und starte die Runde danach neu.";

  app.innerHTML=`<div class="bar"><div class="bar-in">
      <button class="back" id="back">Zurück</button>
      <span class="bar-title">${esc(S.title)} — Ergebnis</span>
    </div><div class="pbar"><i style="width:100%"></i></div></div>

      `<div class="rev"><p class="rq">${esc(w.q)}</p><p class="ra">${esc(w.a)}</p><p class="ra" style="margin-top:5px">${esc(w.e)}</p></div>`

  </div>`;
  document.getElementById("back").onclick=home;
  setActions(`<button class="btn ghost" id="again">Nochmal</button><button class="btn" id="hm">Übersicht</button>`);
  document.getElementById("again").onclick=()=>route(S.modeId);
  document.getElementById("hm").onclick=home;

}
